      try {
        let _nativeFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() {
            return _nativeFetch;
          },
          set: function(fn) {
            _nativeFetch = fn;
          },
          configurable: true,
          enumerable: true
        });
      } catch (err) {}

      // Suprimir erros de extensões de terceiros que tentam injetar scripts no iframe
      window.addEventListener('error', function(event) {
        if (event && event.filename && event.filename.includes('chrome-extension://')) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
